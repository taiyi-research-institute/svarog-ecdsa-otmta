[package]
name = "svarog-ecdsa-otmta"
version = "0.4.0"
edition = "2024"
description = "DKLS23 threshold ECDSA with fresh oblivious transfer setup at signing time."
repository = "https://github.com/taiyi-research-institute/svarog-ecdsa-otmta"
readme = "README.md"
license = "MIT OR Apache-2.0"

[dependencies]
blake2 = "0.10"
erreur = "0.2"
rand = "0.10.1"
rug = "1"
serde = { version = "1", features = ["derive"] }
serde-pickle = "1"

curve-abstract = "0.1.0"
svarog-lagrange = "0.1.0"
svarog-secp256k1 = "0.1.0"

[dev-dependencies]
dashmap = "6"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
